[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltasync"
version = "0.1.0"
description = "Crash-safe incremental synchronization with PostgreSQL"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.2.10"]

[project.optional-dependencies]
dev = ["ruff==0.14.6"]

[project.scripts]
deltasync = "deltasync.cli:main"

[tool.setuptools.packages.find]
include = ["deltasync*"]

[tool.ruff]
target-version = "py311"
